# Investor contact Worker (spec docs/specs/261118-investor-contact.md). Free plan only: past 100k requests a day the
# Worker stops answering instead of billing (R11). This repo is public: every credential and both mail addresses are
# Worker secrets (`npx wrangler secret bulk <file>` from the aos workspace's env/investor-contact/), never here:
#   SMTP_HOST, SMTP_PORT (465 or 587; Workers cannot use 25), SMTP_USER, SMTP_PASS, MAIL_FROM, MAIL_TO, TURNSTILE_SECRET
name = "rotexai-investor-contact"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = true
send_metrics = false

[vars]
ALLOWED_ORIGINS = "https://investor.rotexai.com"
TURNSTILE_HOSTNAME = "investor.rotexai.com"

# Per-IP limit: 3 requests per 60 seconds (R4).
[[ratelimits]]
name = "LIMITER"
namespace_id = "2611181"
simple = { limit = 3, period = 60 }

# Daily counters (R5). Create once with `npx wrangler kv namespace create COUNTS` and put the id here.
[[kv_namespaces]]
binding = "COUNTS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
